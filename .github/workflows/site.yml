# Publishes site/ to GitHub Pages on every push to main, and again every hour with fresh review counts.
# Set up once: put this folder in a GitHub repository, then Settings > Pages > Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"            # every hour (GitHub sometimes starts it a few minutes late)
  workflow_dispatch:                # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read review counts from the store
        run: python3 src/reviews.py
        continue-on-error: true     # a game it can't read keeps the count saved in the repository
      - name: Build the pages
        run: python3 src/build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
